{% extends "base.html" %}

{% block title %}Sign up — VeloLog{% endblock %}

{% block content %}
    <h1>Sign up</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
            <p>
                {{ field.label_tag }}
                {{ field }}
                {{ field.errors }}
            </p>
        {% endfor %}
        <button type="submit">Sign up</button>
    </form>
    <p><a href="{% url 'login' %}">Already have an account? Log in</a></p>
{% endblock %}
