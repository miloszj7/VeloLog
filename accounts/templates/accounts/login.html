{% extends "base.html" %}

{% block title %}Log in — VeloLog{% endblock %}

{% block content %}
    <h1>Log in</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
            <p>
                {{ field.label_tag }}
                {{ field }}
                {{ field.errors }}
            </p>
        {% endfor %}
        <button type="submit">Log in</button>
    </form>
    <p><a href="{% url 'accounts:signup' %}">Need an account? Sign up</a></p>
{% endblock %}
