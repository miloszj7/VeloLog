{% extends "base.html" %}

{% block title %}New trip — VeloLog{% endblock %}

{% block content %}
    <h1>New trip</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
            <p>
                {{ field.label_tag }}
                {{ field }}
                {{ field.errors }}
            </p>
        {% endfor %}
        <button type="submit">Save trip</button>
    </form>
    <p><a href="{% url 'trips:list' %}">Cancel</a></p>
{% endblock %}
