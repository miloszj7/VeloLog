name: Gates and Deploy

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-check-only-not-a-real-secret
      DEBUG: "False"
      ALLOWED_HOSTS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The vendored Leaflet bytes are the one part of the tree nothing else verifies:
      # `collectstatic` hashes whatever it finds, so a tampered or half-written asset
      # deploys under a perfectly valid content-hashed name. This turns the SHA-256 table
      # in gpx/static/gpx/vendor/README.md from a record of what was downloaded into a
      # check on what is checked out. Runs before the venv exists because it needs nothing
      # from it, and a bad asset should fail before six minutes of gates do.
      - name: Vendored asset integrity
        working-directory: gpx/static/gpx/vendor
        run: sha256sum -c SHA256SUMS

      # Same guarantee, for the vendored Bootstrap bytes under static/vendor/bootstrap.
      # Named distinctly so a failure's origin (Leaflet vs. Bootstrap) is unambiguous in
      # the Actions log.
      - name: Vendored asset integrity (Bootstrap)
        working-directory: static/vendor/bootstrap
        run: sha256sum -c SHA256SUMS

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run black --check .

      - name: Import order
        run: uv run isort --check-only .

      - name: Types
        run: uv run mypy .

      - name: Django check
        run: uv run python manage.py check

      - name: Migration guard
        run: uv run python manage.py makemigrations --check --dry-run

      # railway.json &&-chains this same command ahead of gunicorn, so an unresolvable
      # static reference is a boot outage recovered by a manual redeploy — not a
      # degraded deploy. Running it here fails the pull request instead.
      - name: Static files
        run: uv run python manage.py collectstatic --noinput

      - name: Tests
        run: uv run pytest --cov

  deploy:
    needs: gates
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Railway CLI
        run: npm i -g @railway/cli@5.43.1

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: >-
          railway up
          --service=fa5fd9c7-8cd0-47de-bf1b-3515e1f62583
          --project=d0f372e3-e9a6-4a70-bf9a-73d85cdda226
          --environment=production
          --ci
