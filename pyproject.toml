[project]
name = "velolog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.5",
    "django-environ>=0.14.0",
    "gpxpy>=1.6.2",
    "gunicorn>=26.1.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "django-stubs[compatible-mypy]>=6.1.0",
    "isort>=8.0.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.4",
]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.isort]
line_length = 100
profile = "black"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]   # assert/test-passwords are fine in tests

[tool.ruff.format]
line-ending = "lf"
indent-style = "space"

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
strict = true
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "velo_log.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "velo_log.settings"
python_files = ["tests.py", "test_*.py"]
testpaths = ["tests"]
markers = [
    "bite_proof: proves a guard test goes red when the production behavior it names is mutated (tests/mutations.py); spawns a pytest subprocess per case, run explicitly with `pytest -m bite_proof`",
]
# Deselects `bite_proof` from every plain `pytest`/`pytest --cov` run, local or CI, so the
# edit loop and any future per-edit hook pay nothing for the ~12-13 s subprocess cost. A
# bare `-m bite_proof` on the command line overrides this `-m`, not adds to it — that is
# what makes `uv run pytest -m bite_proof` select exactly the marked tests despite looking
# contradictory next to this line.
addopts = '-m "not bite_proof"'

[tool.coverage.run]
source = ["accounts", "trips", "gpx", "velo_log"]
omit = ["velo_log/wsgi.py", "velo_log/asgi.py", "velo_log/settings.py"]
# Statement coverage read 100% on velo_log/urls.py while a defect sat in the line its
# own comment was defending. Branch coverage is clean today; it is on so a future
# half-covered conditional shows up as a gap instead of a full green column.
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
