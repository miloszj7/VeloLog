name: Gates and Deploy

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-check-only-not-a-real-secret
      DEBUG: "False"
      ALLOWED_HOSTS: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run black --check .

      - name: Import order
        run: uv run isort --check-only .

      - name: Types
        run: uv run mypy .

      - name: Django check
        run: uv run python manage.py check

      - name: Migration guard
        run: uv run python manage.py makemigrations --check --dry-run

      # railway.json &&-chains this same command ahead of gunicorn, so an unresolvable
      # static reference is a boot outage recovered by a manual redeploy — not a
      # degraded deploy. Running it here fails the pull request instead.
      - name: Static files
        run: uv run python manage.py collectstatic --noinput

      - name: Tests
        run: uv run pytest --cov

  deploy:
    needs: gates
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli@5.43.1

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: >-
          railway up
          --service=fa5fd9c7-8cd0-47de-bf1b-3515e1f62583
          --project=d0f372e3-e9a6-4a70-bf9a-73d85cdda226
          --environment=production
          --ci
