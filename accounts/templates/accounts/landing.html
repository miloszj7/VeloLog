<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>VeloLog</title>
</head>
<body>
    <p>You are logged in as {{ user.username }}.</p>
    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Log out</button>
    </form>
</body>
</html>
