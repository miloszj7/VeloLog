[project]
name = "velolog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.5",
    "django-environ>=0.14.0",
    "gunicorn>=26.1.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "django-stubs[compatible-mypy]>=6.1.0",
    "isort>=8.0.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.4",
]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.isort]
line_length = 100
profile = "black"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "S"]
ignore = [
    "S608",   # trusted-config table names in INSERT f-strings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]   # assert/test-passwords are fine in tests

[tool.ruff.format]
line-ending = "lf"
indent-style = "space"

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
strict = true
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "velo_log.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "velo_log.settings"
python_files = ["tests.py", "test_*.py"]

[tool.coverage.run]
source = ["accounts", "velo_log"]
omit = ["velo_log/wsgi.py", "velo_log/asgi.py", "velo_log/settings.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
